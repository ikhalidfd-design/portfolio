<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أُنس — ONS | معرض الأعمال</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Marcellus&display=swap" rel="stylesheet">
<style>
:root{--teal:#0d9488;--teal2:#14b8a6;--deep:#0f5e58;--ink:#0c3b38;--muted:#5b7470;--bg:#f4faf9;--line:rgba(13,148,136,.22)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Tajawal',sans-serif;line-height:1.9}
a{color:inherit;text-decoration:none}
.wrap{max-width:1000px;margin:0 auto;padding:clamp(2.5rem,6vw,4.5rem) clamp(1.25rem,4vw,3rem)}
.kicker{font-family:'Marcellus',serif;letter-spacing:.4em;font-size:.64rem;color:var(--teal)}
h1{font-size:clamp(1.8rem,4vw,2.7rem);font-weight:800;margin:.9rem 0}
.lead{color:var(--muted);max-width:720px;font-size:1rem;margin-bottom:2.5rem}
.shot{margin-bottom:2.2rem;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#ffffff;box-shadow:0 14px 34px -22px rgba(15,94,88,.35)}
.shot img{width:100%;display:block}
.shot figcaption{padding:.8rem 1.2rem;font-size:.78rem;color:var(--muted);border-top:1px solid var(--line);background:#ffffff}
.shot figcaption b{color:var(--deep);font-weight:700}
.back{display:inline-block;margin-top:1rem;color:#ffffff;background:linear-gradient(120deg,#0f766e,#14b8a6 55%,#0891b2);padding:.5rem 1.3rem;border-radius:99px;font-size:.82rem;font-weight:700;box-shadow:0 8px 18px -8px rgba(13,148,136,.55)}
</style>
</head>
<body>
<div class="wrap">
  <span class="kicker">ONS — أُنس</span>
  <h1>أُنس — منصة تجهيز المناسبات</h1>
  <p class="lead">منصة لإدارة تجهيز المناسبات من استقبال الطلب حتى التنفيذ والتقييم، مع موقع تعريفي وحملات تسويقية مصاحبة. اللقطات التالية من الواجهات الفعلية.</p>
  <figure class="shot"><img src="../img/ons-1.png" alt="الصفحة الرئيسية"><figcaption><b>الصفحة الرئيسية</b> — واجهة المنصة التعريفية بالخدمات</figcaption></figure>
  <figure class="shot"><img src="../img/ons-2.png" alt="النسخة الكاملة"><figcaption><b>تجربة الاستخدام</b> — عرض الخدمات ومسار الطلب</figcaption></figure>
  <figure class="shot"><img src="../img/card-ons.png" alt="لوحة التحكم"><figcaption><b>لوحة التحكم</b> — إجمالي الطلبات ومقدمو الخدمات والإيرادات وأحدث الطلبات</figcaption></figure>
  <a class="back" href="../index.html">→ رجوع لقائمة الأعمال</a>
</div>
</body>
</html>
